="12" font-weight="600" letter-spacing="0.16em" fill="#16171A">RULES</text><circle cx="827" cy="880" r="2.6" fill="#C9CACF"/><text x="840" y="884" font-family="DM Sans" font-size="12.5" font-weight="400" letter-spacing="0.01em" fill="#5E5F64">The mark is the wordmark in miniature: its first letter and its full stop.</text><circle cx="827" cy="920" r="2.6" fill="#C9CACF"/><text x="840" y="924" font-family="DM Sans" font-size="12.5" font-weight="400" letter-spacing="0.01em" fill="#5E5F64">They never appear side by side — that would spell the letter twice.</text><circle cx="827" cy="960" r="2.6" fill="#C9CACF"/><text x="840" y="964" font-family="DM Sans" font-size="12.5" font-weight="400" letter-spacing="0.01em" fill="#5E5F64">Gap R→dot = one stroke (17.14). Dot = the font's own period, overshoot included.</text><circle cx="827" cy="1000" r="2.6" fill="#C9CACF"/><text x="840" y="1004" font-family="DM Sans" font-size="12.5" font-weight="400" letter-spacing="0.01em" fill="#5E5F64">DM Sans SemiBold, optical size 40, tracking −2%. Outlined: no font at runtime.</text></svg>