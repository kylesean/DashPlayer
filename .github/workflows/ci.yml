# .github/workflows/ci.yml
#
# 质量门禁：lint、类型检查、用例文档一致性、单元测试。
#
# 为什么需要单独一个工作流：release.yml 只做打包发布，此前四个工作流里没有任何
# 一个跑 lint / typecheck / test——类型错误、lint 违规、单测失败都能直接进发布产物。
# 而且 tsconfig.json 没有被任何构建脚本引用（vite/esbuild 只转译、不做类型检查），
# 类型错误只有 IDE 和手工 tsc 能发现，所以这一步必须显式跑。
#
# 不跑 Playwright e2e：它要真实 Electron + 显示环境，单轮约 7 分钟，
# 放在这里会让每次推送都变慢且容易因环境抖动误报。e2e 由维护者本地按需执行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧的运行：门禁要的是最新一次的结果，不是排队等历史提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Github checkout
        uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          # 读 .nvmrc 而不是写死 "22.x"：版本号只能有一个来源。
          # 之前 mise.toml 写 24、.nvmrc 写 22.23.4、这里写 22.x、engines 又同时允许
          # 22 与 24，四处各自表述，于是「本地过、CI 红」这类问题只能在推送后才发现。
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        # CI 不需要装 git hook，跳过安装，避免在无 .git/hooks 写权限时产生噪音
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test case docs
        # 用例 ID 与场景文档的双向绑定只能靠这个脚本强制：它此前只有人手动跑，
        # 于是「只改了 spec 没改文档」会一路绿灯进主干。这里只读文件，不需要构建或显示环境。
        run: node qa/tools/check-test-cases.mjs
      - name: Unit tests
        # vitest 通过 ELECTRON_RUN_AS_NODE=1 以纯 Node 运行，不需要显示环境
        run: pnpm run test:run
